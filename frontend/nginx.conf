# SuperPlanner frontend nginx (PHASE2B 5.5). Installed as /etc/nginx/conf.d/default.conf (http context) in
# nginxinc/nginx-unprivileged, listening on :8080 as a non-root user.
#
# Client IP (review R10): X-Forwarded-For sent to the API is OVERWRITTEN with $remote_addr - never appended
# ($proxy_add_x_forwarded_for would keep a client-supplied leftmost entry, which uvicorn trusts). If an external
# load balancer sits in front, TRUSTED_PROXY_CIDRS (comma list) makes the entrypoint script write
# /etc/nginx/sp-real-ip.conf with `set_real_ip_from` lines, so $remote_addr is the real client after real_ip.

# Request id: pass the client's X-Request-ID through, else use nginx's own id (correlates nginx and API logs).
map $http_x_request_id $sp_request_id {
    ""      $request_id;
    default $http_x_request_id;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    include /etc/nginx/sp-real-ip*.conf;

    # The API answers 413 with its JSON envelope above MAX_BODY_BYTES (5 MiB); let it.
    client_max_body_size 8m;

    # Docker's embedded DNS; a variable upstream is re-resolved, so `--scale api=N` round-robins.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Prometheus metrics are for the internal network only (scrape api:8000/metrics and worker:9101/metrics).
    location = /metrics {
        return 404;
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $sp_request_id;
        # SSE progress streams: no buffering, long reads.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
    }

    # SPA fallback: client-side routes are served index.html.
    location / {
        try_files $uri /index.html;
    }
}
