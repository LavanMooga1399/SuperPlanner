# SuperPlanner production-shaped stack (PHASE2B 5.5, docs/DEPLOY.md section 3).
#
#   cp .env.example .env            # then set POSTGRES_PASSWORD, PUBLIC_BASE_URL, METRICS_TOKEN, ...
#   docker compose up -d --build    # postgres -> migrate (one-shot) -> api + workers -> frontend on :8080
#   docker compose up -d --scale worker=4 --scale api=2
#
# TLS is terminated by an external reverse proxy / load balancer in front of the frontend port; COOKIE_SECURE=true
# (the production default) assumes it. Only the frontend publishes a port. The API trusts X-Forwarded-For only from
# the fixed internal subnet below (where nginx overwrites the header with the peer address, review R10).

name: superplanner

x-backend-env: &backend-env
  SP_ENV: production
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-superplanner}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-superplanner}
  JOB_BACKEND: queue
  LOG_FORMAT: ${LOG_FORMAT:-json}

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-superplanner}
      POSTGRES_USER: ${POSTGRES_USER:-superplanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # C collation (byte order) like the test clusters (review R12); UTF-8 encoding.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]
    # ports: ["5432:5432"]   # debugging only - never expose the database publicly

  migrate:
    build:
      <<: *backend-build
      target: api
    image: superplanner-api:${SP_IMAGE_TAG:-latest}
    command: ["python", "-m", "superplanner.migrate", "upgrade"]
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  api:
    build:
      <<: *backend-build
      target: api
    image: superplanner-api:${SP_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-env
      WORKER_EMBEDDED: "0"
      HOST: 0.0.0.0
      PORT: "8000"
      FORWARDED_ALLOW_IPS: ${SP_INTERNAL_SUBNET:-172.28.0.0/24}
    expose: ["8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 30s
    networks: [backend]

  worker:
    build:
      <<: *backend-build
      target: worker
    image: superplanner-worker:${SP_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-env
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    # Longer than WORKER_SHUTDOWN_GRACE_SECONDS (30): running jobs finish or are requeued before SIGKILL.
    stop_grace_period: 45s
    expose: ["9101"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/metrics', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks: [backend]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: superplanner-frontend:${SP_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]

networks:
  backend:
    ipam:
      config:
        - subnet: ${SP_INTERNAL_SUBNET:-172.28.0.0/24}

volumes:
  pgdata:
