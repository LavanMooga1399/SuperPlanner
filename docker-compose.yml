# SuperPlanner production-shaped stack (PHASE2B 5.5, docs/DEPLOY.md section 3). PostgreSQL only.
#
#   cp .env.example .env            # then set the three DB passwords, PUBLIC_BASE_URL, METRICS_TOKEN, ...
#   docker compose up -d --build    # db -> migrate (one-shot, owner role) -> api + workers (app role) -> frontend
#   docker compose up -d --scale worker=4 --scale api=2
#   docker compose up -d db         # only the database (local development, README "Quick start")
#
# Database roles (docs/DEPLOY.md "Database roles"): POSTGRES_USER is the bootstrap superuser (never used by the
# application). On the FIRST start of an empty volume, backend/scripts/docker-initdb-roles.sh runs
# backend/scripts/pg_setup_roles.sql: SP_DB_OWNER_USER owns the database and runs the migrations
# (MIGRATION_DATABASE_URL), SP_DB_APP_USER is the restricted DML-only role of the API and workers (DATABASE_URL).
# The database port is published on 127.0.0.1 only (local tools / development); remove `ports` on shared hosts.
#
# TLS is terminated by an external reverse proxy / load balancer in front of the frontend port; COOKIE_SECURE=true
# (the production default) assumes it. Only the frontend publishes a port. The API trusts X-Forwarded-For only from
# the fixed internal subnet below (where nginx overwrites the header with the peer address, review R10).

name: superplanner

x-backend-env: &backend-env
  APP_ENV: production
  DATABASE_URL: postgresql+psycopg://${SP_DB_APP_USER:-superplanner_app}:${SP_DB_APP_PASSWORD:?set SP_DB_APP_PASSWORD in .env}@db:5432/${POSTGRES_DB:-superplanner}
  JOB_BACKEND: queue
  LOG_FORMAT: ${LOG_FORMAT:-json}

# Backend containers (migrate, api, worker): read-only root filesystem (the code under /app is root-owned and
# never written at runtime), no Linux capabilities, no privilege escalation; /tmp is a small tmpfs.
x-backend-hardening: &backend-hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=64m,mode=1777"]

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-superplanner}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # C collation (byte order) like the test clusters (review R12); UTF-8 encoding.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
      # read by docker-initdb-roles.sh on the first start of an empty volume
      SP_DB_OWNER_USER: ${SP_DB_OWNER_USER:-superplanner_owner}
      SP_DB_OWNER_PASSWORD: ${SP_DB_OWNER_PASSWORD:?set SP_DB_OWNER_PASSWORD in .env}
      SP_DB_APP_USER: ${SP_DB_APP_USER:-superplanner_app}
      SP_DB_APP_PASSWORD: ${SP_DB_APP_PASSWORD:?set SP_DB_APP_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/pg_setup_roles.sql:/sp/pg_setup_roles.sql:ro
      - ./backend/scripts/docker-initdb-roles.sh:/docker-entrypoint-initdb.d/50-superplanner-roles.sh:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  migrate:
    <<: *backend-hardening
    build:
      <<: *backend-build
      target: api
    image: superplanner-api:${SP_IMAGE_TAG:-latest}
    command: ["python", "-m", "superplanner.migrate", "upgrade"]
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-env
      # migrations run as the owner role; the API and workers never get this URL
      MIGRATION_DATABASE_URL: postgresql+psycopg://${SP_DB_OWNER_USER:-superplanner_owner}:${SP_DB_OWNER_PASSWORD:?set SP_DB_OWNER_PASSWORD in .env}@db:5432/${POSTGRES_DB:-superplanner}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  api:
    <<: *backend-hardening
    build:
      <<: *backend-build
      target: api
    image: superplanner-api:${SP_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-env
      WORKER_EMBEDDED: "0"
      HOST: 0.0.0.0
      PORT: "8000"
      FORWARDED_ALLOW_IPS: ${SP_INTERNAL_SUBNET:-172.28.0.0/24}
    expose: ["8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 30s
    networks: [backend]

  worker:
    <<: *backend-hardening
    build:
      <<: *backend-build
      target: worker
    image: superplanner-worker:${SP_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-env
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    # Longer than WORKER_SHUTDOWN_GRACE_SECONDS (30): running jobs finish or are requeued before SIGKILL.
    stop_grace_period: 45s
    expose: ["9101"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/metrics', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks: [backend]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: superplanner-frontend:${SP_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]

networks:
  backend:
    ipam:
      config:
        - subnet: ${SP_INTERNAL_SUBNET:-172.28.0.0/24}

volumes:
  pgdata:
