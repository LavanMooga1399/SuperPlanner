[project]
name = "superplanner"
version = "0.1.0"
description = "SuperPlanner MVP: universal planning engine and FastAPI service"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.1",
    "starlette==1.8.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "SQLAlchemy==2.1.4",
    "ortools==9.15.6755",
    "numpy==2.5.4",
    "anthropic==1.15.0",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "argon2-cffi==25.1.0",
    "prometheus-client==0.26.0",
    "openpyxl==3.1.5",
    "et-xmlfile==2.0.0",
    "defusedxml==0.7.1",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["superplanner*"]

[tool.setuptools.package-data]
"superplanner.migrations" = ["script.py.mako"]
"superplanner.api.auth" = ["common_passwords.txt"]
"superplanner.mfg.mrp.fixtures" = ["*.json"]
"superplanner.mfg.aps.fixtures" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "slow: long benchmarks",
    "inline_jobs: runs with JOB_BACKEND=inline (uses ctx.executor / inline restart recovery)",
    "pg_load: queue load test (PostgreSQL only)",
]
