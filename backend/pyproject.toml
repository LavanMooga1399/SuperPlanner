[project]
name = "superplanner"
version = "0.1.0"
description = "SuperPlanner MVP: universal planning engine and FastAPI service"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.143.1",
    "starlette==1.8.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "SQLAlchemy==2.1.4",
    "ortools==9.15.6755",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["superplanner*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["slow: long benchmarks"]
